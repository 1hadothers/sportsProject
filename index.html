<title>TennisSet — Offline Scoreboard</title>
<style>
  /* ============================================================
     TENNISSET — broadcast-style offline scoreboard
     Styled with the `tennis-board-design` skill:
       · two horizontal player rows, stacked
       · name left · sets + games as middle columns · points right
       · navy #0B1220, mint #00E0A4 vs coral #FF5C7A, white text
       · system type, huge numerals (clamp 3-6rem), sets/games muted
       · server dot glows in the serving player's accent
       · one animation only: the 200ms point pop
     Kept inline rather than in styles.css so the app stays a
     single file that runs offline by double-click.
     ============================================================ */
  :root {
    --bg: #0B1220;
    --surface: #101A2E;
    --surface-2: #0D1626;
    --line: rgba(255, 255, 255, 0.10);
    --line-strong: rgba(255, 255, 255, 0.22);
    --text: #F2F5FA;
    --muted: #8A94A8;
    --p1: #00E0A4;
    --p2: #FF5C7A;
    --ball: #DFF24B;
    --radius: 14px;
    --dur-fast: 200ms;
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --font: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    /* shared board columns: dot · name · sets · games · points · action */
    --cols: 26px minmax(0, 1fr) 78px 78px minmax(112px, 150px) 116px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    padding-bottom: 42px;   /* room for the fixed headlines ticker */
    -webkit-font-smoothing: antialiased;
  }

  /* --- atmosphere: faint court geometry + player accent glows --- */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background:
      radial-gradient(44rem 28rem at 10% -10%, rgba(0, 224, 164, 0.08), transparent 62%),
      radial-gradient(44rem 28rem at 92% 110%, rgba(255, 92, 122, 0.08), transparent 62%),
      linear-gradient(90deg, transparent calc(50% - 0.5px), var(--line) calc(50% - 0.5px), var(--line) calc(50% + 0.5px), transparent calc(50% + 0.5px)) 0 14% / 100% 72% no-repeat,
      linear-gradient(var(--line) 1px, transparent 1px) 0 14% / 100% 72% no-repeat;
  }
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background: radial-gradient(circle at 50% 45%, transparent 45%, rgba(0, 0, 0, 0.4) 100%);
  }

  header, main, footer { position: relative; z-index: 1; }

  /* --- header --- */
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    padding: 1.1rem clamp(1rem, 4vw, 3rem);
    border-bottom: 1px solid var(--line);
  }
  .wordmark {
    display: flex;
    align-items: center;
    gap: 0.35rem;
    font-weight: 900;
    font-size: 1.1rem;
    letter-spacing: 0.26em;
    text-transform: uppercase;
  }
  .wordmark em { font-style: normal; color: var(--muted); }
  .status {
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: right;
  }

  /* --- the board --- */
  main {
    flex: 1;
    width: 100%;
    max-width: 58rem;
    margin: 0 auto;
    padding: clamp(1.1rem, 3vw, 2.4rem) clamp(1rem, 4vw, 3rem);
    display: grid;
    grid-template-columns: 1fr;
    align-content: start;
    gap: 0.55rem;
  }

  /* column labels, aligned to the same grid as the player rows */
  .board-head {
    display: grid;
    grid-template-columns: var(--cols);
    align-items: end;
    gap: 0.5rem;
    padding: 0 0.9rem 0.1rem;
  }
  .board-head .h {
    font-size: 0.58rem;
    font-weight: 700;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: center;
  }
  .board-head .h.first { text-align: left; }

  /* player row */
  .row {
    display: grid;
    grid-template-columns: var(--cols);
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 0.9rem;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background-color: var(--surface-2);
    transition: border-color var(--dur-fast) var(--ease-out);
  }
  .row[data-p="0"] { background-image: linear-gradient(90deg, rgba(0, 224, 164, 0.07), transparent 34%); }
  .row[data-p="1"] { background-image: linear-gradient(90deg, rgba(255, 92, 122, 0.07), transparent 34%); }
  .row:hover { border-color: var(--line-strong); }

  /* serving ball */
  .serve-dot { display: grid; place-items: center; }
  .serve-dot .ball {
    opacity: 0.12;
    transition: opacity var(--dur-fast) var(--ease-out);
  }
  .row[data-p="0"] .serve-dot.on .ball { color: var(--p1); opacity: 1; filter: drop-shadow(0 0 6px rgba(0, 224, 164, 0.75)); }
  .row[data-p="1"] .serve-dot.on .ball { color: var(--p2); opacity: 1; filter: drop-shadow(0 0 6px rgba(255, 92, 122, 0.75)); }

  /* name */
  .name {
    min-width: 0;
    background: transparent;
    border: none;
    border-bottom: 1px dashed transparent;
    color: var(--text);
    font-family: inherit;
    font-size: clamp(0.95rem, 2vw, 1.25rem);
    font-weight: 900;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 0.3rem 0.1rem;
    text-overflow: ellipsis;
  }
  .name:hover { border-bottom-color: var(--line-strong); }
  .name:focus { outline: none; border-bottom-color: currentColor; }

  /* sets + games: middle columns, muted gray */
  .stat { text-align: center; }
  .stat .value {
    font-size: 1.45rem;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    line-height: 1.1;
  }

  /* points: huge accent numeral */
  .points {
    font-size: clamp(3rem, 9vw, 6rem);
    font-weight: 900;
    line-height: 0.95;
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
    text-align: center;
  }
  .row[data-p="0"] .points { color: var(--p1); }
  .row[data-p="1"] .points { color: var(--p2); }

  /* the board's one animation: point pop */
  @media (prefers-reduced-motion: no-preference) {
    .points.pop { animation: pop var(--dur-fast) var(--ease-out); }
    @keyframes pop {
      0% { transform: scale(1); }
      45% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }
  }

  /* point action: full-height accent strip at the row's right edge */
  .point-btn {
    align-self: stretch;
    min-height: 58px;
    border: none;
    border-radius: 10px;
    font-family: inherit;
    font-size: 0.8rem;
    font-weight: 900;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--bg);
    cursor: pointer;
    transition: filter 150ms ease-out, transform 150ms ease-out, opacity 150ms ease-out;
  }
  .row[data-p="0"] .point-btn { background: var(--p1); }
  .row[data-p="1"] .point-btn { background: var(--p2); }
  .point-btn:hover:not(:disabled) { filter: brightness(1.08); }
  .point-btn:active:not(:disabled) { transform: scale(0.98); }
  .point-btn:disabled { opacity: 0.25; cursor: not-allowed; }

  /* --- the net stretched across the court between the two rows --- */
  .net-h {
    height: 7px;
    margin: 0.15rem 0.3rem;
    background:
      linear-gradient(rgba(255, 255, 255, 0.7) 0 2px, transparent 2px) 0 0 / 100% 2px no-repeat,
      repeating-linear-gradient(to right, rgba(255, 255, 255, 0.20) 0 2px, transparent 2px 10px);
  }

  /* --- deuce badge + winner banner --- */
  .deuce {
    justify-self: center;
    font-size: 0.7rem;
    font-weight: 900;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--bg);
    background: var(--ball);
    border-radius: 999px;
    padding: 0.3rem 1.1rem;
    visibility: hidden;
  }
  .deuce.show { visibility: visible; }

  .banner {
    display: none;
    text-align: center;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    padding: 1.1rem 1rem;
    background: var(--surface);
  }
  .banner.show { display: block; }
  .banner .title {
    font-size: clamp(1.1rem, 3.5vw, 1.9rem);
    font-weight: 900;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .banner .sub {
    margin-top: 0.3rem;
    color: var(--muted);
    font-size: 0.8rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  /* --- controls --- */
  footer {
    display: flex;
    justify-content: center;
    gap: 0.8rem;
    padding: 1rem clamp(1rem, 4vw, 3rem) 1.6rem;
    border-top: 1px solid var(--line);
  }
  .ctrl {
    min-height: 48px;
    padding: 0 1.6rem;
    border-radius: 999px;
    border: 1px solid var(--line-strong);
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 150ms ease-out, border-color 150ms ease-out, opacity 150ms ease-out;
  }
  .ctrl:hover:not(:disabled) { background: var(--surface-2); border-color: var(--text); }
  .ctrl:disabled { opacity: 0.35; cursor: not-allowed; }
  .ctrl.danger:hover:not(:disabled) { border-color: var(--p2); color: var(--p2); }

  /* --- sports headlines ticker, pinned along the bottom of the court --- */
  .ticker {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 2;
    display: flex;
    align-items: stretch;
    height: 42px;
    background: var(--surface);
    border-top: 1px solid var(--line-strong);
  }
  .ticker-label {
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    padding: 0 1rem;
    background: var(--ball);
    color: var(--bg);
    font-size: 0.6rem;
    font-weight: 900;
    letter-spacing: 0.22em;
    text-transform: uppercase;
  }
  .ticker-view {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 2%, #000 97%, transparent);
    mask-image: linear-gradient(90deg, transparent, #000 2%, #000 97%, transparent);
  }
  .ticker-track {
    display: flex;
    align-items: center;
    gap: 2rem;
    white-space: nowrap;
    will-change: transform;
  }
  .ticker-track .item {
    display: inline-flex;
    align-items: baseline;
    gap: 0.5rem;
    font-size: 0.8rem;
    letter-spacing: 0.03em;
    color: var(--text);
  }
  .ticker-track .src {
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .ticker-track .sep { color: var(--ball); font-size: 0.5rem; }

  @media (prefers-reduced-motion: no-preference) {
    .ticker-track { animation: ticker-scroll linear infinite; }
    .ticker:hover .ticker-track,
    .ticker:focus-within .ticker-track { animation-play-state: paused; }
    @keyframes ticker-scroll {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }   /* the list is duplicated, so -50% loops seamlessly */
    }
  }
  /* reduced motion: hold the headlines still, let them be scrolled by hand instead */
  @media (prefers-reduced-motion: reduce) {
    .ticker-view { overflow-x: auto; }
  }

  :is(button, input):focus-visible {
    outline: 2px solid var(--ball);
    outline-offset: 2px;
  }

  /* --- responsive: tighten the columns, keep the row layout intact --- */
  @media (max-width: 640px) {
    :root { --cols: 20px minmax(0, 1fr) 46px 46px minmax(74px, 1fr) 74px; }
    main { padding-inline: 0.85rem; }
    .row { padding: 0.4rem 0.6rem; gap: 0.35rem; }
    .board-head { padding-inline: 0.6rem; }
    .points { font-size: clamp(2rem, 12vw, 3.2rem); }
    .stat .value { font-size: 1.1rem; }
    .point-btn { min-height: 50px; border-radius: 8px; font-size: 0.65rem; letter-spacing: 0.1em; }
  }
</style>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "tennisSet.v1";
  var POINT_LABELS = ["0", "15", "30", "40"];

  // ------- state -------
  function freshState(keepNames) {
    return {
      names: keepNames ? keepNames.slice() : ["PLAYER ONE", "PLAYER TWO"],
      points: [0, 0],   // 0..3  →  0/15/30/40
      adv: null,        // null | 0 | 1  (advantage player)
      games: [0, 0],    // games in current set
      sets: [0, 0],     // sets won (best of 3 → first to 2)
      server: 0,        // 0 or 1, alternates each game
      matchOver: false,
      winner: null,
      history: []       // snapshots taken before every point
    };
  }

  var state = load() || freshState();

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      var s = JSON.parse(raw);
      // basic shape guard so a corrupt save never breaks the app
      if (s && Array.isArray(s.points) && Array.isArray(s.games) && Array.isArray(s.sets)) return s;
      return null;
    } catch (e) { return null; }
  }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* storage unavailable — keep playing in memory */ }
  }

  function snapshot() {
    state.history.push(JSON.stringify({
      points: state.points, adv: state.adv, games: state.games,
      sets: state.sets, server: state.server, matchOver: state.matchOver, winner: state.winner
    }));
    if (state.history.length > 400) state.history.shift();
  }

  // ------- scoring -------
  function awardPoint(i) {
    if (state.matchOver) return;
    snapshot();

    var o = 1 - i;
    var gameWon = false;

    if (state.adv === i) {
      gameWon = true;                            // AD held → game
    } else if (state.adv === o) {
      state.adv = null;                          // AD lost → back to deuce
    } else if (state.points[i] === 3) {
      if (state.points[o] === 3) state.adv = i;  // 40-40 deuce → advantage
      else gameWon = true;                       // 40 vs ≤30 → game
    } else {
      state.points[i] += 1;
    }

    if (gameWon) winGame(i);
    save();
    render(i);
  }

  function winGame(i) {
    var o = 1 - i;
    state.points = [0, 0];
    state.adv = null;
    state.games[i] += 1;
    state.server = 1 - state.server;   // serve alternates every game

    // set: first to 6 games with a 2-game lead. Covers 6-4 and 7-5;
    // from 6-6 it plays out to 8-6, 9-7, ... which is exactly
    // "first to 7 with a 2-game lead" expressed as lead ≥ 2.
    if (state.games[i] >= 6 && state.games[i] - state.games[o] >= 2) {
      state.sets[i] += 1;
      state.games = [0, 0];
      if (state.sets[i] >= 2) {        // best of 3
        state.matchOver = true;
        state.winner = i;
      }
    }
  }

  function undo() {
    if (!state.history.length) return;
    var prev = JSON.parse(state.history.pop());
    state.points = prev.points;
    state.adv = prev.adv;
    state.games = prev.games;
    state.sets = prev.sets;
    state.server = prev.server;
    state.matchOver = prev.matchOver;
    state.winner = prev.winner;
    save();
    render();
  }

  function newMatch() {
    if (!window.confirm("Start a new match? Current scores will be cleared.")) return;
    state = freshState(state.names);   // keep names, wipe scores
    save();
    render();
  }

  // ------- render -------
  function el(id) { return document.getElementById(id); }
  var els = {
    pts: [el("pts0"), el("pts1")],
    games: [el("games0"), el("games1")],
    sets: [el("sets0"), el("sets1")],
    dots: [el("dot0"), el("dot1")],
    names: [el("name0"), el("name1")],
    btns: [el("btn0"), el("btn1")],
    status: el("status"),
    deuce: el("deuce"),
    banner: el("banner"),
    bannerTitle: el("bannerTitle"),
    undo: el("undoBtn")
  };

  function pointLabel(i) {
    if (state.adv === i) return "AD";
    return POINT_LABELS[state.points[i]];
  }

  function render(popIndex) {
    var i;
    for (i = 0; i < 2; i++) {
      els.pts[i].textContent = pointLabel(i);
      els.games[i].textContent = state.games[i];
      els.sets[i].textContent = state.sets[i];
      els.dots[i].classList.toggle("on", !state.matchOver && state.server === i);
      if (document.activeElement !== els.names[i]) els.names[i].value = state.names[i];
      els.btns[i].disabled = state.matchOver;
    }

    // deuce badge: both at 40, no advantage
    var isDeuce = !state.matchOver && state.adv === null &&
                  state.points[0] === 3 && state.points[1] === 3;
    els.deuce.classList.toggle("show", isDeuce);

    // status line / winner banner
    if (state.matchOver) {
      els.status.textContent = "Match complete";
      els.bannerTitle.textContent = state.names[state.winner] + " wins the match";
      els.bannerTitle.style.color = state.winner === 0 ? "var(--p1)" : "var(--p2)";
      els.banner.classList.add("show");
    } else {
      var setNo = Math.min(state.sets[0] + state.sets[1] + 1, 3);
      var gameNo = state.games[0] + state.games[1] + 1;
      els.status.textContent = "Set " + setNo + " \u00B7 Game " + gameNo;
      els.banner.classList.remove("show");
    }

    els.undo.disabled = state.history.length === 0;

    // the board's single animation: pop the numeral that just scored
    if (popIndex !== undefined && popIndex !== null) {
      var node = els.pts[popIndex];
      node.classList.remove("pop");
      void node.offsetWidth; // restart the animation if it is already running
      node.classList.add("pop");
      node.addEventListener("animationend", function h() {
        node.classList.remove("pop");
        node.removeEventListener("animationend", h);
      });
    }
  }

  // ------- sports headlines ticker -------
  // Compiled in on purpose: the board must run with zero network requests, and a static
  // file cannot talk to a local MCP server at runtime. These headlines come from the
  // `mcp-news` MCP server (tool: news(topic, date?, sort?)), which searches NewsAPI.org.
  // To refresh: run that tool and paste the new titles below. Nothing else to change.
  var NEWS = [
    { t: "Shelton stuns defending champion Alcaraz in five sets, sets up all-American US Open semi", s: "Reuters" },
    { t: "Tiafoe battles back from two sets down to reach the US Open semi-finals", s: "Reuters" },
    { t: "Zverev meets Khachanov as the top seed chases a second major title", s: "Reuters" },
    { t: "Rybakina beats Gauff to reach her first US Open final", s: "CBS Sports" },
    { t: "Sabalenka stays on course for a third straight US Open crown", s: "CBS Sports" },
    { t: "Zheng Qinwen's US Open run ends in the quarter-finals against Rybakina", s: "Xinhua" },
    { t: "Rybakina set to become the WTA world No.1 for the first time", s: "Huanqiu" },
    { t: "Zheng Qinwen confirmed for the China Open with a wildcard", s: "Huanqiu" },
    { t: "49ers rout Rams 27-7 in the NFL's first regular-season game in Australia", s: "NFL.com" },
    { t: "Purdy throws three touchdowns as the 49ers silence the Super Bowl favourites", s: "NFL.com" },
    { t: "Week 1 injury wave: A.J. Brown feared out until mid-October", s: "CBS Sports" },
    { t: "No.1 Ohio State vs No.4 Texas headlines college football's Week 2", s: "CBS Sports" },
    { t: "Bayern run out 5-0 winners over Bodo/Glimt as Champions League matchday one closes", s: "CBS Sports" }
  ];

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // Build the strip twice so the -50% translate loops with no visible seam.
  function renderTicker() {
    var track = el("tickerTrack");
    var strip = NEWS.map(function (n) {
      return '<span class="item">' + escapeHtml(n.t) +
             '<span class="src">' + escapeHtml(n.s) + '</span></span>' +
             '<span class="sep" aria-hidden="true">\u25CF</span>';
    }).join("");
    track.innerHTML = strip + strip;

    // Pace the scroll to the content width (~55px per second) so short and long
    // headline lists both read at a comfortable speed.
    requestAnimationFrame(function () {
      var half = track.scrollWidth / 2;
      if (half > 0) track.style.animationDuration = Math.max(25, Math.round(half / 55)) + "s";
    });
  }

  // ------- wiring -------
  renderTicker();

  els.btns[0].addEventListener("click", function () { awardPoint(0); });
  els.btns[1].addEventListener("click", function () { awardPoint(1); });
  els.undo.addEventListener("click", undo);
  el("newBtn").addEventListener("click", newMatch);

  els.names.forEach(function (input, i) {
    input.addEventListener("input", function () {
      state.names[i] = input.value;
      save();
      if (state.matchOver) els.bannerTitle.textContent = state.names[state.winner] + " wins the match";
    });
  });

  render();
})();
</script>
</body>
</html>
